<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS flex-flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS | flex-flow Property</h1>

    <!-- Ví dụ 1: row nowrap (giá trị mặc định) -->
    <div class="example" id="ex1">
        <h2>Ví dụ 1: <code>flex-flow: row nowrap;</code></h2>
        <div class="container-1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </div>

    <!-- Ví dụ 2: row-reverse nowrap -->
    <div class="example" id="ex2">
        <h2>Ví dụ 2: <code>flex-flow: row-reverse nowrap;</code></h2>
        <div class="container-2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </div>
</body>
</html>
